services:
  # Express Backend API Web Service
  - type: web
    name: nexus-erp-server
    env: node
    buildCommand: cd server && npm install && npx prisma generate && npm run build
    startCommand: cd server && npx prisma migrate deploy && npm run seed && node dist/server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-erp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: '*'

  # React Frontend Static Site
  - type: web
    name: nexus-erp-client
    env: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        value: https://nexus-erp-server.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # PostgreSQL Managed Database Instance
  - name: nexus-erp-db
    databaseName: nexus_erp_crm
    user: nexus_admin
