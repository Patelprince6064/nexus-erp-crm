services:
  # Express Backend API Web Service
  - type: web
    name: nexus-erp-server
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push --accept-data-loss && npx prisma db seed && node dist/server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-erp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://nexus-erp-client.onrender.com

  # React Frontend Static Site
  - type: web
    name: nexus-erp-client
    env: static
    plan: free
    rootDir: client
    buildCommand: npm install && VITE_API_URL=https://nexus-erp-server.onrender.com/api npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # PostgreSQL Managed Database Instance
  - name: nexus-erp-db
    databaseName: nexus_erp_crm
    user: nexus_admin
    plan: free
